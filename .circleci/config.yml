version: 2.1

commands:

  setup_openjdk_all_toolchain:
    description: "Setup ToolChain for OpenJdk all"
    steps:
      - run: mkdir ~/.m2
      - run: |
          cat > ~/.m2/toolchains.xml \<< EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains xmlns="http://maven.apache.org/TOOLCHAINS/1.1.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/TOOLCHAINS/1.1.0 http://maven.apache.org/xsd/toolchains-1.1.0.xsd">
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>1.8</version>
                <vendor>openjdk</vendor>
                <id>openjdk-1.8</id>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME}</jdkHome>
              </configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>11</version>
                <vendor>openjdk</vendor>
                <id>openjdk-11</id>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME}</jdkHome>
              </configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>17</version>
                <vendor>openjdk</vendor>
                <id>openjdk-17</id>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME}</jdkHome>
              </configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>21</version>
                <vendor>openjdk</vendor>
                <id>openjdk-21</id>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME}</jdkHome>
              </configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>25</version>
                <vendor>openjdk</vendor>
                <id>openjdk-25</id>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF

  std_mvnw_jdk_param:
    parameters:
      jdkVersion:
        type: string
    description: "Standard Java << parameters.jdkVersion >> mvnw steps"
    steps:
      - checkout
      - run:
          name: "Maven Java << parameters.jdkVersion >> Clean Install SkipTests"
          command: ./mvnw --batch-mode --fail-at-end --no-transfer-progress --update-snapshots -Pcicd clean install -DskipTests
      - run:
          name: "Maven Java << parameters.jdkVersion >> Tests"
          command: ./mvnw --batch-mode --fail-at-end --no-transfer-progress --update-snapshots -Pcicd test
      - run:
          name: "Tidy Cache before save"
          command: rm -rf ~/.m2/repository/com/github/nhojpatrick
          when: always

  qa_step:
    parameters:
      stepName:
        type: string
    description: "Standard QA Step << parameters.stepName >>"
    steps:
      - checkout
      - run: ./mvnw --batch-mode --fail-at-end --no-transfer-progress --update-snapshots -Pcicd,qa_<< parameters.stepName >> -DskipTests verify

jobs:
  passed_builds:
    docker:
      - image: alpine:latest
    resource_class: small
    steps:
      - run: echo "Build Passed"

  passed_qa:
    docker:
      - image: alpine:latest
    resource_class: small
    steps:
      - run: echo "QA Passed"

  jdk8:
    docker:
      - image: cimg/openjdk:8.0
    steps:
      - setup_openjdk_all_toolchain
      - std_mvnw_jdk_param:
          jdkVersion: "8"

  jdk11:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - setup_openjdk_all_toolchain
      - std_mvnw_jdk_param:
          jdkVersion: "11"

  jdk17:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - setup_openjdk_all_toolchain
      - std_mvnw_jdk_param:
          jdkVersion: "17"

  jdk21:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - setup_openjdk_all_toolchain
      - std_mvnw_jdk_param:
          jdkVersion: "21"

  jdk25:
    docker:
      - image: cimg/openjdk:25.0
    steps:
      - setup_openjdk_all_toolchain
      - std_mvnw_jdk_param:
          jdkVersion: "25"

  qa_matrix:
    parameters:
      qa_step_profile:
        type: string
      qa_step_jdk:
        type: string
    docker:
      - image: cimg/openjdk:<< parameters.qa_step_jdk >>
    resource_class: small
    steps:
      - setup_openjdk_all_toolchain
      - qa_step:
          stepName: << parameters.qa_step_profile >>

workflows:
  version: 2
  build_all:
    jobs:
      - jdk8
      - jdk11:
          filters:
            branches:
              ignore:
                - develop
                - main
      - jdk17:
          filters:
            branches:
              ignore:
                - develop
                - main
      - jdk21:
          filters:
            branches:
              ignore:
                - develop
                - main
      - jdk25:
          filters:
            branches:
              ignore:
                - develop
                - main

      - passed_builds:
          requires:
            - jdk8
            - jdk11
            - jdk17
            - jdk21
            - jdk25

      - qa_matrix:
          name: qa_<< matrix.qa_step_profile >>_jdk_<< matrix.qa_step_jdk >>
          requires:
            - passed_builds
          filters:
            branches:
              ignore:
                - develop
                - main
          matrix:
            parameters:
              qa_step_profile: [
                "sortpom"
              ]
              qa_step_jdk: [
                "8.0"
              ]

      - passed_qa:
          requires:
            - qa_matrix
